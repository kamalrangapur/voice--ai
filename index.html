<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Voice + Gesture AI</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
      text-align: center;
    }
    video {
      width: 100%;
      max-width: 300px;
      border-radius: 12px;
      border: 2px solid #38bdf8;
      transform: scaleX(-1);
      background: #000;
    }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      margin: 8px 4px;
      border-radius: 999px;
      background: #1e293b;
      font-size: 13px;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 10px;
      margin-top: 8px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
    }
    input {
      width: 90%;
      max-width: 300px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      margin-bottom: 10px;
    }
    #log {
      max-width: 380px;
      margin: 14px auto;
      text-align: left;
      background: #1e293b;
      padding: 12px;
      border-radius: 10px;
      min-height: 85px;
      font-size: 14px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <h3>🤖 Live Voice + Gesture AI</h3>
  <input id="apiKey" type="password" placeholder="Paste Groq API Key (gsk_...)" />
  <br />
  <video id="cam" autoplay playsinline muted></video>
  <div>
    <span class="badge" id="gestureBadge">Gesture: None</span>
    <span class="badge" id="statusBadge">Status: Idle</span>
  </div>
  <button id="startBtn">Start Camera & Voice</button>
  <div id="log">Enter your API key, tap <b>Start Camera & Voice</b>, show a gesture, and speak.</div>

  <script type="module">
    import { GestureRecognizer, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("cam");
    const gestureBadge = document.getElementById("gestureBadge");
    const statusBadge = document.getElementById("statusBadge");
    const logBox = document.getElementById("log");
    const startBtn = document.getElementById("startBtn");

    let recognizer;
    let currentGesture = "None";
    let lastGestureTrigger = 0;
    let isBusy = false;

    async function initGestureModel() {
      statusBadge.textContent = "Status: Loading Vision...";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      recognizer = await GestureRecognizer.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 1
      });
    }

    async function startCamera() {
      statusBadge.textContent = "Status: Starting Camera...";
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: 320, height: 240 },
        audio: false
      });
      video.srcObject = stream;
      await new Promise((resolve) => (video.onloadedmetadata = resolve));
      detectLoop();
    }

    function detectLoop() {
      if (recognizer && video.readyState >= 2) {
        const result = recognizer.recognizeForVideo(video, performance.now());
        if (result.gestures.length > 0 && result.gestures[0][0].score > 0.65) {
          const gestureName = result.gestures[0][0].categoryName;
          if (gestureName && gestureName !== "None") {
            currentGesture = gestureName;
            gestureBadge.textContent = `Gesture: ${gestureName}`;

            if (!isBusy && Date.now() - lastGestureTrigger > 6000 && gestureName !== "Pointing_Up") {
